# Veröffentlicht das Spiel bei jedem Push automatisch auf GitHub Pages.
# Der Inhalt von app/public wird in den Branch "gh-pages" kopiert;
# GitHub Pages zeigt diesen Branch dann öffentlich an.
name: Spiel veröffentlichen

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./app/public
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
